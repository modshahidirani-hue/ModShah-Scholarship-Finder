{% extends 'base.html' %}{% block content %}<small>ADMINISTRATION</small><h1>Admin dashboard</h1><section class="features"><article>Registered users<h2>{{ users }}</h2></article><article>Scholarships<h2>{{ scholarship_count }}</h2></article><article>Applications<h2>{{ apps }}</h2></article></section><section class="formbox wide"><h2>Add a scholarship</h2><form method="post" action="/admin/add" class="gridform"><label>Title<input name="title" required></label><label>Provider<input name="provider" required></label><label>Amount (₹)<input type="number" name="amount"></label><label>Deadline<input type="date" name="deadline"></label><label>Minimum marks (%)<input type="number" step=".01" name="minimum_marks"></label><label>Income limit (₹)<input type="number" name="income_limit"></label><label>Official URL<input type="url" name="official_url"></label><label class="span">Description<textarea name="description"></textarea></label><button class="btn">Add scholarship</button></form></section>{% endblock %}
