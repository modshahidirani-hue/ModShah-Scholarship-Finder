{% extends 'base.html' %}{% block content %}<small>KEEP MOVING FORWARD</small><h1>Application tracker</h1><div class="tablewrap"><table><tr><th>Scholarship</th><th>Provider</th><th>Deadline</th><th>Status</th><th>Update</th></tr>{% for a in applications %}<tr><td>{{ a.title }}</td><td>{{ a.provider }}</td><td>{{ a.deadline or '—' }}</td><td>{{ a.status }}</td><td><form method="post" action="/tracker/update/{{ a.id }}"><select name="status">{% for st in ['Interested','Preparing','Submitted','Approved','Rejected'] %}<option {% if a.status==st %}selected{% endif %}>{{ st }}</option>{% endfor %}</select><button class="btn small">Save</button></form></td></tr>{% else %}<tr><td colspan="5">No applications tracked yet.</td></tr>{% endfor %}</table></div>{% endblock %}
