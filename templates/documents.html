{% extends 'base.html' %}{% block content %}<small>YOUR FILES</small><h1>Documents</h1><form method="post" enctype="multipart/form-data" class="formbox"><label>Choose PDF, PNG or JPG<input type="file" name="document" accept=".pdf,.png,.jpg,.jpeg" required></label><button class="btn">Upload</button></form><section class="formbox">{% for d in documents %}<p>📄 {{ d.original_name }} <small>{{ d.uploaded_at }}</small></p>{% else %}<p>No documents uploaded yet.</p>{% endfor %}</section>{% endblock %}
