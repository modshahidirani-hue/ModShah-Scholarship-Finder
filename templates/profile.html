{% extends 'base.html' %}{% block content %}<section class="formbox wide"><small>YOUR DETAILS</small><h1>Student profile</h1><form method="post" class="gridform"><label>Education / course<input name="education" value="{{ student.education if student else '' }}" placeholder="B.E. Computer Science"></label><label>Marks / percentage<input type="number" step=".01" min="0" max="100" name="marks" value="{{ student.marks if student and student.marks is not none else '' }}"></label><label>Annual family income (₹)<input type="number" min="0" name="annual_income" value="{{ student.annual_income if student and student.annual_income is not none else '' }}"></label><label>Location<input name="location" value="{{ student.location if student else '' }}" placeholder="City, State"></label><label>Category (optional)<input name="category" value="{{ student.category if student else '' }}"></label><button class="btn">Save profile</button></form></section>{% endblock %}
